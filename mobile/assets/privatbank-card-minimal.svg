<svg xmlns="http://www.w3.org/2000/svg" width="300" height="188" viewBox="0 0 300 188" role="img" aria-labelledby="title desc">
  <title id="title">Минималистичная карта ПриватБанка</title>
  <desc id="desc">Декоративная зелёная банковская карта с вымышленными данными</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6BD44D"/>
      <stop offset="55%" stop-color="#259A58"/>
      <stop offset="100%" stop-color="#12724A"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="300" height="188" rx="17"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="300" height="188" fill="url(#green)"/>
    <circle cx="294" cy="-11" r="91" fill="#FFFFFF" opacity=".10"/>
    <circle cx="298" cy="-11" r="61" fill="#FFFFFF" opacity=".09"/>
    <circle cx="27" cy="190" r="94" fill="#0A5939" opacity=".12"/>
  </g>
  <!-- Minimal bank sign and name -->
  <g transform="translate(22 23)">
    <rect width="24" height="24" rx="5" fill="#FFFFFF"/>
    <path d="M5 6H19V19H14V11H5Z" fill="#238F4B"/>
    <path d="M5 14H12V19H5Z" fill="#238F4B"/>
    <text x="34" y="17" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="-.5">ПриватБанк</text>
  </g>
  <!-- Simple contactless mark -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".83" transform="translate(245 89)">
    <path d="M0 0Q6 6 0 12"/>
    <path d="M6 -4Q17 6 6 16"/>
    <path d="M12 -8Q28 6 12 20"/>
  </g>
  <!-- Card details: fictitious, masked -->
  <text x="22" y="139" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" letter-spacing="1.3">••••  ••••  4821</text>
  <text x="22" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" letter-spacing="1.1" fill="#E5F9E8">УНІВЕРСАЛЬНА</text>
  <text x="276" y="165" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="italic" font-weight="800" fill="#FFFFFF" text-anchor="end">VISA</text>
</svg>
